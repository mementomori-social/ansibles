---
- name: Common server settings
  hosts: all
  become: true
  tasks:

    - name: Define users
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
        append: true
        groups:
          - sudo
      loop:
        - rolle
        - ikke

    - name: Set ssh public keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        state: present
        key: "{{ lookup('file', item.keyfile) }}"
        exclusive: true
      loop:
        - { name: 'rolle', keyfile: 'pubkeys-rolle.pub' }
        - { name: 'ikke', keyfile: 'pubkeys-ikke.pub' }

    - name: Fix SSH options
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regex: "^{{ item.option }}"
        insertafter: "^ *# *{{ item.option }}"
        line: "{{ item.line }}"
      loop:
        # deny password or root login
        - { option: 'PermitRootLogin', line: 'PermitRootLogin no' }
        - { option: 'PasswordAuthentication', line: 'PasswordAuthentication no' }
      notify: Restart sshd

    - name: Give passwordless sudo powers to sudo group
      ansible.builtin.copy:
        dest: /etc/sudoers.d/01-sudo-group
        content: |
          # Ansible managed
          %sudo ALL=(ALL) NOPASSWD:ALL

    - name: Install some basic goodies
      tags: pkgs
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - tmux
        - zsh
        - btop

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
