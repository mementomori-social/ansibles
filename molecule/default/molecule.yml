---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/collections/requirements.yml

ansible:
  cfg:
    defaults:
      collections_path: collections
      inventory: inventory.yml
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory.yml
        - --vault-password-file=../../.vaultpw
        # - -e @../../secrets/vault.yml

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
