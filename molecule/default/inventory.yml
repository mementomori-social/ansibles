---
all:
  children:
    mastodon:
      hosts:
        mastodon-0:
          ansible_host: mastodon-0
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
        valkey-0:
          ansible_host: valkey-0
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
      vars:
        required_packages:
          - python3
          - systemd
          - ssh
        container_log_driver: json-file
        container_systemd: false
    elastic:
      hosts:
        elastic-0:
          ansible_host: elastic-0
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
      vars:
        required_packages:
          - python3
          - systemd
          - ssh
        container_log_driver: json-file
        container_systemd: false
    postgresql:
      hosts:
        postgresql-0:
          ansible_host: postgresql-0
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
      vars:
        required_packages:
          - python3
          - systemd
          - ssh
        container_log_driver: json-file
        container_systemd: false
