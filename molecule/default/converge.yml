---

- name: Common tests
  tags: common
  ansible.builtin.import_playbook: ../../common.yml

- name: Mastodon
  tags: mastodon
  vars:
    skip_in_tests: true
  ansible.builtin.import_playbook: ../../mastodon.yml

- name: Nginx
  tags: nginx
  vars:
    skip_in_tests: true
    nginx_mementomori_letsencrypt_enabled: false
  ansible.builtin.import_playbook: ../../nginx.yml

- name: Postgresql
  tags: postgresql
  vars:
    skip_in_tests: true
  ansible.builtin.import_playbook: ../../postgresql.yml

- name: Valkey
  tags: valkey
  vars:
    skip_in_tests: true
  ansible.builtin.import_playbook: ../../valkey.yml

- name: Elasticsearch
  tags: elasticsearch
  vars:
    skip_in_tests: true
  ansible.builtin.import_playbook: ../../elasticsearch.yml
