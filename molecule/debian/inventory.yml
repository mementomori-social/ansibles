---
all:
  children:
    mastodon:
      hosts:
        mastodon:
          ansible_host: mastodon
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
        valkey:
          ansible_host: valkey
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
      vars:
        required_packages:
          - python3
          - systemd
          - ssh
        container_log_driver: json-file
        container_systemd: false
    elastic:
      hosts:
        mastodon:
        elastic:
          ansible_host: elastic
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
      vars:
        required_packages:
          - python3
          - systemd
          - ssh
        container_log_driver: json-file
        container_systemd: false
    postgresql:
      hosts:
        postgresql:
          ansible_host: postgresql
          ansible_connection: containers.podman.podman
          container_image: docker.io/jomrr/molecule-debian:stable
          container_command: /sbin/init
          container_privileged: false
      vars:
        required_packages:
          - python3
          - systemd
          - ssh
        container_log_driver: json-file
        container_systemd: false
