---
- name: Create UpCloud mastodon host
  hosts: localhost
  connection: local
  vars:
    upcloud_token: "{{ vault_upcloud_ansible_token }}"
    upcloud_api_url: "https://api.upcloud.com/1.3"
    zone: "fi-hel2"
    server_hostname: "mastodon-0.mementomori.social"
    server_title: "Mastodon Server"
    server_plan: "CLOUDNATIVE-8xCPU-32GB"
    source_storage_uuid: "01000000-0000-4000-8000-000030260200"
    storage_size_root: 20
    # Created beforehand with upctl storage create, see README
    data_storage_uuid: "017dfec3-dcdc-43d0-a5f2-0ebb40de2ea4"
    network_name: "fi-hel2-mastodon-network"
    server_ip: 10.222.222.12
    labels:
      - key: role
        value: mastodon
      - key: ruby
        value: "true"
      - key: nginx
        value: "true"
      - key: valkey
        value: "true"
      - key: letsencrypt
        value: "true"

  tasks:
    - name: Fetch networks from upcloud
      ansible.builtin.uri:
        url: "{{ upcloud_api_url }}/network"
        method: GET
        headers:
          Authorization: "Bearer {{ upcloud_token }}"
      register: upcloud_networks_response
      no_log: true

    - name: Find network UUID by name
      ansible.builtin.set_fact:
        mastodon_network:
          "{{ (upcloud_networks_response.json.networks.network | selectattr('name', 'equalto', network_name) | first) }}"

    - name: Display network info
      ansible.builtin.debug:
        msg: "Network {{ mastodon_network.name }} has UUID {{ mastodon_network.uuid }}"

    - name: Create UpCloud server
      ansible.builtin.uri:
        url: "{{ upcloud_api_url }}/server"
        method: POST
        headers:
          Authorization: "Bearer {{ upcloud_token }}"
        body_format: json
        body:
          server:
            hostname: "{{ server_hostname }}"
            title: "{{ server_title }}"
            zone: "{{ zone }}"
            plan: "{{ server_plan }}"
            metadata: 'yes'
            # firewall: ''
            storage_devices:
              storage_device:
                - title: "{{ server_hostname }}-rootdisk"
                  action: clone
                  storage: "{{ source_storage_uuid }}"
                  tier: "standard"
                  size: "{{ storage_size_root }}"
                - action: attach
                  storage: "{{ data_storage_uuid }}"
            networking:
              interfaces:
                interface:
                  - type: public
                    ip_addresses:
                      ip_address:
                        - family: IPv4
                  - type: public
                    ip_addresses:
                      ip_address:
                        - family: IPv6
                  - type: private
                    source_ip_filtering: 'no'
                    network: "{{ mastodon_network.uuid }}"
                    bootable: 'no'
                    ip_addresses:
                      ip_address:
                        - address: "{{ server_ip }}"
                          family: IPv4
                          dhcp_provided: 'yes'
            nic_model: virtio
            password_delivery: 'none'
            timezone: "Europe/Helsinki"
            labels:
              label: "{{ labels }}"
            login_user:
              username: ansible
              ssh_keys:
                ssh_key:
                  # yamllint disable-line rule:line-length
                  - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAHARxa2K5cS2dge9f9cX3ULPoCxYypAgjNciWf1FZOEpAywH+a9XuSSAILLrPqcF8JT27zG4kc8gLzcee4WwO9o+gHRQGVhiufSk9vqVY86enL4r/RvkVAd1J9VdhbUzDhmIOcDC5+jAQqnxsJdqWgfH1ZTgojYAi3Gnl6Ue49xXYY+mA== ikke@freeknas.ikenet
              create_password: 'no'
        status_code: 202
      register: upcloud_server_response

    - name: Debug the return code
      ansible.builtin.debug:
        var: upcloud_server_response

    - name: Set fact with created server details
      ansible.builtin.set_fact:
        upcloud_server: "{{ upcloud_server_response.json.server }}"
        upcloud_server_uuid: "{{ upcloud_server_response.json.server.uuid }}"
        upcloud_server_state: "{{ upcloud_server_response.json.server.state }}"

  post_tasks:
    - name: Display created server info
      ansible.builtin.debug:
        msg:
          - "Server UUID: {{ upcloud_server_uuid }}"
          - "Server Title: {{ upcloud_server.title }}"
          - "Server Hostname: {{ upcloud_server.hostname }}"
          - "Server Zone: {{ upcloud_server.zone }}"
          - "Server State: {{ upcloud_server_state }}"
          - "Server Plan: {{ upcloud_server.plan }}"
          - "Attached Network: {{ mastodon_network.name }} ({{ mastodon_network.uuid }})"
