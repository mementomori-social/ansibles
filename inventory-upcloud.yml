plugin: upcloud.cloud.servers
# fi-hel2-mastodon-network, needed for private_ipv4
network:
  - 03e9a09b-1a8d-4b52-9d1e-4f5e63045704
# Prefer private network; bastion overridden to public in compose.
connect_with:
  - private_ipv4
  - public_ipv4
# role=elastic label becomes group elastic, matching the playbooks.
keyed_groups:
  - key: labels | select('match', '^role=') | map('regex_replace', '^role=', '') | first
    prefix: ""
    separator: ""
compose:
  ansible_user: "'ansible'"
  ansible_host: "'87.58.148.167' if 'role=bastion' in labels else ansible_host"
  ansible_ssh_common_args: "'' if 'role=bastion' in labels else '-o ProxyJump=ansible@87.58.148.167'"
