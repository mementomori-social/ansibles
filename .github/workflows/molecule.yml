---
name: Molecule

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install tooling
        run: pip install ansible-core molecule

      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      # Fake values only, so converge never needs the real vault password.
      - name: Fake vault
        run: |
          cp molecule/default/ci-vault.yml group_vars/all/vault.yml
          echo ci > .vaultpw

      - name: Molecule test
        run: molecule test
