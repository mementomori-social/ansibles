---
name: Dev environment
# Runs dev.sh on clean machines, twice, and checks the site in curl and Chrome.
# Jobs cover port 443 free and a local nginx on 443 that already serves
# another site and an older mementomori.test site.
# Ubuntu runs the whole stack, with Podman and with Docker, and the fork's
# bin/mementomori-dev check. Fedora does the same with Podman in a VM, with
# SELinux on.
# GitHub's macOS runners can't run a container VM (no nested virtualisation), so the
# macOS job sets everything else up and puts a stand-in HTTPS server where the
# stack would listen.

"on":
  push:
    branches: [main]
    paths: &paths
      - 'dev.sh'
      - 'dev.yml'
      - 'inventory-dev.yml'
      - 'roles/dev-vm/**'
      - 'tests/dev-browser-check.sh'
      - '.github/workflows/dev.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      fork_branch:
        description: Fork branch to set up, empty for the newest mementomods branch
        default: ''

permissions:
  contents: read

jobs:
  dev:
    # Same Ubuntu as the servers
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each engine, each port setup, once: enough coverage at half the runners
      matrix:
        include:
          - { engine: podman, front: nginx }
          - { engine: docker, front: none }
    env:
      FORK: https://github.com/mementomori-social/mastodon.git
      FORK_BRANCH: ${{ inputs.fork_branch || vars.DEV_FORK_BRANCH }}
      CHECKOUT: /home/runner/Projects/mastodon
    steps:
      - uses: actions/checkout@v7

      - name: Put nginx on 443 with another site and an older mementomori.test
        if: matrix.front == 'nginx'
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=local \
            -keyout /etc/nginx/local.key -out /etc/nginx/local.pem
          for site in other.test mementomori.test; do
            printf 'server {\n  listen 443 ssl;\n  server_name %s;\n  ssl_certificate /etc/nginx/local.pem;\n  ssl_certificate_key /etc/nginx/local.key;\n  return 200 "old %s\\n";\n}\n' \
              "$site" "$site" | sudo tee "/etc/nginx/sites-available/$site"
            sudo ln -s "../sites-available/$site" "/etc/nginx/sites-enabled/$site"
          done
          echo '127.0.0.1 other.test' | sudo tee -a /etc/hosts
          sudo systemctl restart nginx

      # With Docker the app container runs as uid 1000 and writes into the
      # checkout; the runner is uid 1001. Rootless Podman maps it to the runner.
      - name: Clone the fork where the container can write
        run: |
          branch=${FORK_BRANCH:-$(git ls-remote --heads "$FORK" | grep -oE 'refs/heads/mementomods-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sed 's#refs/heads/##' | sort | tail -1)}
          echo "Fork branch: $branch"
          git clone --depth 1 --branch "$branch" "$FORK" "$CHECKOUT"
          chmod -R a+rwX "$CHECKOUT"

      - name: Run dev.sh
        run: ./dev.sh -e dev_vm_engine=${{ matrix.engine }}

      - name: Run dev.sh again, nothing should change
        run: |
          ./dev.sh -e dev_vm_engine=${{ matrix.engine }} | tee "$RUNNER_TEMP/second-run.log"
          grep -E 'localhost +: ok=[0-9]+ +changed=0 ' "$RUNNER_TEMP/second-run.log"

      - name: Check the stack
        working-directory: ${{ env.CHECKOUT }}
        run: |
          if grep -q '^  check)' bin/mementomori-dev; then
            bin/mementomori-dev check
          else
            curl -fsS https://mementomori.test/health
          fi

      - name: Open the site in Chrome
        run: tests/dev-browser-check.sh https://mementomori.test/about Mastodon

      - name: Check nginx kept the other site and moved the old one aside
        if: matrix.front == 'nginx'
        run: |
          curl -fsSk https://other.test | grep 'old other.test'
          ls ~/.local/share/mementomori-dev/nginx-backup/mementomori.test.*
          if curl -fsS https://mementomori.test/ | grep -q 'old mementomori.test'; then
            echo "nginx still serves the old mementomori.test site"
            exit 1
          fi

      - name: Show logs
        if: failure()
        working-directory: ${{ env.CHECKOUT }}
        run: bin/mementomori-dev compose logs --tail 300

  # A Fedora VM, so SELinux is on as on a real Fedora machine
  dev-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORK: https://github.com/mementomori-social/mastodon.git
      FORK_BRANCH: ${{ inputs.fork_branch || vars.DEV_FORK_BRANCH }}
      FEDORA_IMAGES: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images
      VM: ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -i vm-key fedora@127.0.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansibles

      - name: Start a Fedora VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          image=$(curl -fsSL "$FEDORA_IMAGES/" | grep -oE 'Fedora-Cloud-Base-Generic[^"<]*x86_64\.qcow2' | head -1)
          curl -fsSL -o fedora.qcow2 "$FEDORA_IMAGES/$image"
          qemu-img resize fedora.qcow2 60G
          ssh-keygen -q -t ed25519 -N '' -f vm-key
          printf '#cloud-config\nssh_authorized_keys:\n  - %s\n' "$(cat vm-key.pub)" > user-data
          cloud-localds seed.img user-data
          qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 12G \
            -drive file=fedora.qcow2,if=virtio -drive file=seed.img,if=virtio,format=raw \
            -nic user,hostfwd=tcp::2222-:22 -display none -serial file:serial.log -daemonize
          for _ in $(seq 60); do $VM true 2>/dev/null && break; sleep 5; done
          $VM 'cat /etc/fedora-release && getenforce | grep -x Enforcing'

      - name: Copy ansibles and clone the fork
        run: |
          tar -C ansibles -cz . | $VM 'mkdir -p ansibles && tar -C ansibles -xz'
          branch=${FORK_BRANCH:-$(git ls-remote --heads "$FORK" | grep -oE 'refs/heads/mementomods-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sed 's#refs/heads/##' | sort | tail -1)}
          echo "Fork branch: $branch"
          $VM "sudo dnf install -y -q git && git clone -q --depth 1 --branch $branch $FORK Projects/mastodon"

      - name: Run dev.sh
        run: $VM 'ansibles/dev.sh'

      - name: Check the stack
        run: $VM 'cd Projects/mastodon && bin/mementomori-dev check'

      - name: Show logs
        if: failure()
        run: |
          tail -50 serial.log
          $VM 'cd Projects/mastodon && bin/mementomori-dev compose logs --tail 300' || true

  dev-macos:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        front: [nginx]
    env:
      FORK: https://github.com/mementomori-social/mastodon.git
      FORK_BRANCH: ${{ inputs.fork_branch || vars.DEV_FORK_BRANCH }}
      CHECKOUT: /Users/runner/Projects/mastodon
    steps:
      - uses: actions/checkout@v7

      - name: Put nginx on 443 with another site and an older mementomori.test
        if: matrix.front == 'nginx'
        run: |
          brew install nginx
          servers="$(brew --prefix)/etc/nginx/servers"
          mkdir -p "$servers"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=local \
            -keyout "$servers/../local.key" -out "$servers/../local.pem"
          for site in other.test mementomori.test; do
            printf 'server {\n  listen 443 ssl;\n  server_name %s;\n  ssl_certificate local.pem;\n  ssl_certificate_key local.key;\n  return 200 "old %s\\n";\n}\n' \
              "$site" "$site" > "$servers/$site.conf"
          done
          echo '127.0.0.1 other.test' | sudo tee -a /etc/hosts
          sudo "$(brew --prefix)/bin/nginx"

      - name: Clone the fork
        run: |
          branch=${FORK_BRANCH:-$(git ls-remote --heads "$FORK" | grep -oE 'refs/heads/mementomods-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sed 's#refs/heads/##' | sort | tail -1)}
          echo "Fork branch: $branch"
          git clone --depth 1 --branch "$branch" "$FORK" "$CHECKOUT"

      - name: Run dev.sh without the Docker stack
        run: ./dev.sh -e dev_vm_stack=false

      - name: Run dev.sh again, nothing should change
        run: |
          ./dev.sh -e dev_vm_stack=false | tee "$RUNNER_TEMP/second-run.log"
          grep -E 'localhost +: ok=[0-9]+ +changed=0 ' "$RUNNER_TEMP/second-run.log"

      # Serves the stack's certificate on the port the stack would use
      - name: Start a stand-in for the stack
        working-directory: ${{ env.CHECKOUT }}
        run: |
          mkdir -p "$RUNNER_TEMP/site" && echo OK > "$RUNNER_TEMP/site/health"
          cat > "$RUNNER_TEMP/stand-in.py" <<'PY'
          import http.server, ssl, sys
          port, cert, key, root = int(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]
          handler = lambda *a: http.server.SimpleHTTPRequestHandler(*a, directory=root)
          server = http.server.ThreadingHTTPServer(('127.0.0.1', port), handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(cert, key)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          sudo nohup python3 "$RUNNER_TEMP/stand-in.py" "$(cat dev/https-port)" \
            dev/certs/mementomori.test.pem dev/certs/mementomori.test-key.pem "$RUNNER_TEMP/site" \
            > "$RUNNER_TEMP/stand-in.log" 2>&1 &
          sleep 2

      - name: Check the site in curl
        run: curl -fsS https://mementomori.test/health | grep OK

      # Headless Chrome hangs on these runners even for a plain page, while
      # curl above already verifies the certificate through the system trust.
      - name: Open the site in Chrome
        continue-on-error: true
        run: tests/dev-browser-check.sh https://mementomori.test/health OK

      - name: Check nginx kept the other site and moved the old one aside
        if: matrix.front == 'nginx'
        run: |
          curl -fsSk https://other.test | grep 'old other.test'
          ls ~/.local/share/mementomori-dev/nginx-backup/mementomori.test.conf.*
