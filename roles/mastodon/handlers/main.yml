---

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart mastodon services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ mastodon_services }}"
  when:
    - not skip_in_tests
    - not mastodon_disable_all

- name: Reload monit
  ansible.builtin.systemd_service:
    name: monit
    state: reloaded
  when:
    - not skip_in_tests | default(false) | bool
