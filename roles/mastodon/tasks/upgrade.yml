---
- name: Check for MERGE_HEAD to detect incomplete merge
  ansible.builtin.stat:
    path: "{{ mastodon_home }}/live-git/MERGE_HEAD"
  register: merge_head

- name: Abort incomplete merge
  become: true
  become_user: mastodon
  ansible.builtin.command: git merge --abort
  args:
    chdir: "{{ mastodon_home }}/live"
  when: merge_head.stat.exists | bool
  changed_when: false

- name: Check for uncommitted changes
  become: true
  become_user: mastodon
  ansible.builtin.command: git diff --quiet && git diff --cached --quiet
  args:
    chdir: "{{ mastodon_home }}/live"
  register: uncommitted_check
  ignore_errors: true
  changed_when: false

- name: Stash uncommitted changes
  become: true
  become_user: mastodon
  ansible.builtin.command: git stash push -m "Auto-stash before production upgrade on {{ ansible_date_time.iso8601 }}"
  args:
    chdir: "{{ mastodon_home }}/live"
  when: uncommitted_check.rc != 0
  changed_when: true

- name: Fetch latest changes from git remote
  become: true
  become_user: mastodon
  ansible.builtin.command: git fetch origin
  args:
    chdir: "{{ mastodon_home }}/live"
  changed_when: false

- name: Checkout or update mastodon version branch
  become: true
  become_user: mastodon
  ansible.builtin.command: git checkout {{ mastodon_version_metadata }}
  args:
    chdir: "{{ mastodon_home }}/live"
  changed_when: true

- name: Read .ruby-version from live
  ansible.builtin.slurp:
    src: "{{ mastodon_home }}/live/.ruby-version"
  register: ruby_version_file

- name: Set ruby version fact
  ansible.builtin.set_fact:
    ruby_version: "{{ ruby_version_file.content | b64decode | trim }}"

- name: Check if required Ruby version is installed
  become: true
  become_user: mastodon
  ansible.builtin.command: "{{ mastodon_home }}/.rbenv/versions/{{ ruby_version }}/bin/ruby" --version
  args:
    chdir: "{{ mastodon_home }}"
  register: ruby_check
  ignore_errors: true
  changed_when: false

- name: Update ruby-build definitions
  become: true
  become_user: mastodon
  ansible.builtin.git:
    repo: 'https://github.com/rbenv/ruby-build.git'
    dest: "{{ mastodon_home }}/.rbenv/plugins/ruby-build"
    update: true
  when: ruby_check.rc != 0

- name: Install required Ruby version
  become: true
  become_user: mastodon
  ansible.builtin.command: "{{ mastodon_home }}/.rbenv/bin/rbenv install {{ ruby_version }}"
  args:
    chdir: "{{ mastodon_home }}"
    creates: "{{ mastodon_home }}/.rbenv/versions/{{ ruby_version }}"
  environment:
    RUBY_CONFIGURE_OPTS: --with-jemalloc
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"
    RBENV_SHELL: /usr/bin/bash
  when: ruby_check.rc != 0
  notify: Restart mastodon services

- name: Stop sidekiq services for migration
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ mastodon_services }}"
  when: not skip_in_tests and item is search('sidekiq')

- name: Clean yarn cache
  become: true
  become_user: mastodon
  ansible.builtin.command: yarn cache clean
  args:
    chdir: "{{ mastodon_home }}/live"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"
  changed_when: false

- name: Remove node_modules for clean rebuild
  become: true
  become_user: mastodon
  ansible.builtin.file:
    path: "{{ mastodon_home }}/live/node_modules"
    state: absent

- name: Check ICU version for charlock_holmes
  ansible.builtin.command: pkg-config --modversion icu-uc
  register: icu_version
  ignore_errors: true
  changed_when: false

- name: Configure bundle for native gems with C++20 for ICU 78+
  become: true
  become_user: mastodon
  ansible.builtin.command: bundle config build.charlock_holmes --with-cxxflags='-std=c++20'
  args:
    chdir: "{{ mastodon_home }}/live"
  when: icu_version.rc == 0 and icu_version.stdout is defined and icu_version.stdout.split('.')[0] | int >= 78
  changed_when: false

- name: Bundle install
  become: true
  become_user: mastodon
  ansible.builtin.command: bundle install
  args:
    chdir: "{{ mastodon_home }}/live"
    creates: "{{ mastodon_home }}/live/vendor/bundle"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"

- name: Yarn install
  become: true
  become_user: mastodon
  ansible.builtin.command: yarn install --immutable
  args:
    chdir: "{{ mastodon_home }}/live"
    creates: "{{ mastodon_home }}/live/node_modules"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"

- name: Precompile assets
  become: true
  become_user: mastodon
  ansible.builtin.command: RAILS_ENV=production bundle exec rails assets:precompile
  args:
    chdir: "{{ mastodon_home }}/live"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"
    RUBY_CONFIGURE_OPTS: --with-jemalloc
  notify: Restart mastodon services

- name: Check for pending migrations
  become: true
  become_user: mastodon
  ansible.builtin.command: RAILS_ENV=production bundle exec rails db:migrate:status
  args:
    chdir: "{{ mastodon_home }}/live"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"
  register: migration_status
  changed_when: false

- name: Run pending migrations
  become: true
  become_user: mastodon
  ansible.builtin.command: RAILS_ENV=production bundle exec rails db:migrate
  args:
    chdir: "{{ mastodon_home }}/live"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"
  when: migration_status.stdout_lines is defined and migration_status.stdout_lines | select('search', 'down') | list | length > 0
  notify: Restart mastodon services

- name: Restart sidekiq services after migration
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop: "{{ mastodon_services }}"
  when: not skip_in_tests and item is search('sidekiq')

- name: Clear cache
  become: true
  become_user: mastodon
  ansible.builtin.command: RAILS_ENV=production {{ mastodon_home }}/live/bin/tootctl cache clear
  args:
    chdir: "{{ mastodon_home }}/live"
  environment:
    PATH: "{{ mastodon_home }}/.rbenv/bin:{{ mastodon_home }}/.rbenv/shims:{{ ansible_facts.env.PATH }}"
  notify: Restart mastodon services

- name: Restart all mastodon services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop: "{{ mastodon_services }}"
  when: not skip_in_tests