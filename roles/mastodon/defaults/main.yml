---

mastodon_data_device: /dev/vdb

# Ported from the Hetzner host's /etc/sysctl.d/99-mastodon.conf. Kernel
# defaults give ~28k ephemeral ports, which a federating instance exhausts.
mastodon_sysctl_tunables:
  vm.swappiness: 10
  net.ipv4.ip_local_port_range: 1024 65535
  net.ipv4.tcp_max_syn_backlog: 8192
  net.core.netdev_max_backlog: 5000
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_keepalive_time: 600
  net.ipv4.tcp_keepalive_intvl: 30
  net.ipv4.tcp_keepalive_probes: 5
  fs.file-max: 2097152
mastodon_data_mountpoint: /data
mastodon_mount_fs_type: ext4
mastodon_mount_opts: defaults
mastodon_home: "{{ mastodon_data_mountpoint }}/mastodon"

mastodon_disable_all: false

mastodon_packages:
  - autoconf
  - bison
  - build-essential
  - curl
  - ffmpeg
  - file
  - git
  - imagemagick
  - libffi-dev
  - libgdbm-dev
  - libicu-dev
  - libidn-dev
  - libjemalloc-dev
  - libpq-dev
  - libreadline-dev
  - libssl-dev
  - libvips-tools
  - libxslt1-dev
  - libyaml-dev
  - nodejs
  - pkg-config
  - postgresql-client
  - postgresql-client-common
  - protobuf-compiler
  - python3-pexpect
  - rustc
  - wget
  - zlib1g-dev

mastodon_systemd_sidekiq_files:
  - mastodon-sidekiq@.service
  - mastodon-sidekiq-1-default@.service
  - mastodon-sidekiq-1-ingress@.service
  - mastodon-sidekiq-2-default@.service
  - mastodon-sidekiq-2-ingress@.service
  - mastodon-sidekiq-fasp@.service
  - mastodon-sidekiq-mailers@.service
  - mastodon-sidekiq-pull@.service
  - mastodon-sidekiq-push@.service
  - mastodon-sidekiq-scheduler@.service

mastodon_systemd_files:
  - mastodon-streaming.service
  - mastodon-streaming@.service
  - mastodon-web.service
  # timers
  - mastodon-build-search-index.service
  - mastodon-build-search-index.timer
  - mastodon-check@.service
  - mastodon-check@db.timer
  - mastodon-check@diskspace.timer
  - mastodon-check@elasticsearch.timer
  - mastodon-check@sidekiq.timer
  - mastodon-check@streaming.timer
  - mastodon-fedifetcher.service
  - mastodon-fedifetcher.timer
  - mastodon-flush-dead-jobs.service
  - mastodon-flush-dead-jobs.timer
  - mastodon-media-clear.service
  - mastodon-media-clear.timer
  - mastodon-finnish-users-fetch.service
  - mastodon-finnish-users-fetch.timer
  - mastodon-prune.service
  - mastodon-prune.timer
  - mastodon-refetch-preview-cards.service
  - mastodon-refetch-preview-cards.timer
  - mastodon-sidekiq-restart.service
  - mastodon-sidekiq-restart.timer

mastodon_services:
  - mastodon-sidekiq-1-default@35.service
  - mastodon-sidekiq-1-ingress@25.service
  - mastodon-sidekiq-2-default@35.service
  - mastodon-sidekiq-2-ingress@25.service
  - mastodon-sidekiq-fasp@1.service
  - mastodon-sidekiq-mailers@20.service
  - mastodon-sidekiq-pull@40.service
  - mastodon-sidekiq-push@35.service
  - mastodon-sidekiq-scheduler@5.service
  - mastodon-streaming.service
  - mastodon-streaming@4000.service
  - mastodon-streaming@4001.service
  - mastodon-streaming@4002.service
  - mastodon-streaming@4003.service
  - mastodon-web.service
  # timers
  - mastodon-check@db.timer
  - mastodon-check@diskspace.timer
  - mastodon-check@elasticsearch.timer
  - mastodon-check@sidekiq.timer
  - mastodon-check@streaming.timer
  - mastodon-media-clear.timer
  - mastodon-prune.timer
  - mastodon-build-search-index.timer
  - mastodon-flush-dead-jobs.timer
  - mastodon-fedifetcher.timer
  - mastodon-refetch-preview-cards.timer
  - mastodon-finnish-users-fetch.timer

mastodon_fedifetch_access_token: "{{ vault_mastodon_fedifetch_access_token }}"
mastodon_fedifetch_server: mementomori.social
mastodon_betterstack_sidekick: "{{ vault_mastodon_betterstack_sidekick }}"
mastodon_betterstack_db: "{{ vault_mastodon_betterstack_db }}"
mastodon_betterstack_streaming: "{{ vault_mastodon_betterstack_streaming }}"
mastodon_betterstack_diskspace: "{{ vault_mastodon_betterstack_diskspace }}"
mastodon_betterstack_elastic: "{{ vault_mastodon_betterstack_elastic }}"
mastodon_betterstack_vector_token: "{{ vault_mastodon_betterstack_vector_token }}"
mastodon_vector_endpoint: https://in.logs.betterstack.com/
mastodon_vector_version: 0.43.0

#
# Mastodon server settings
#
mastodon_local_domain: mementomori.social
mastodon_single_user_mode: 'false'
mastodon_secret_key_base: "{{ vault_mastodon_secret_key_base }}"
mastodon_otp_secret: "{{ vault_mastodon_otp_secret }}"
mastodon_vapid_private_key: "{{ vault_mastodon_vapid_private_key }}"
mastodon_vapid_public_key: "{{ vault_mastodon_vapid_public_key }}"
mastodon_db_host: 10.222.222.13
mastodon_db_port: 5432
mastodon_db_name: "{{ vault_mastodon_db_name }}"
mastodon_db_user: "{{ vault_mastodon_db_user }}"
mastodon_db_pass: "{{ vault_mastodon_db_pass }}"
mastodon_replica_db_host: ""
mastodon_elasticearch_host: 10.222.222.11
mastodon_elasticearch_port: 9200
mastodon_elasticearch_user: "{{ vault_mastodon_elasticearch_user }}"
mastodon_elasticearch_pass: "{{ vault_mastodon_elasticearch_pass }}"

mastodon_web_concurrency: 6
mastodon_max_threads: 10
mastodon_db_pool: 25
mastodon_redis_host: localhost
mastodon_redis_port: 6379
mastodon_redis_password: "{{ vault_mastodon_redis_password }}"
mastodon_smtp_server: smtp.eu.mailgun.org
mastodon_smtp_port: 587
mastodon_smtp_login: "{{ vault_mastodon_smtp_login }}"
mastodon_smtp_password: "{{ vault_mastodon_smtp_password }}"
mastodon_smtp_auth_method: plain
mastodon_smtp_openssl_verify_mode: none
mastodon_smtp_from_address: "{{ vault_mastodon_smtp_from_address }}"
mastodon_rails_log_level: warn
mastodon_es_enabled: 'true'
mastodon_es_host: 10.222.222.11
mastodon_es_port: 9200
mastodon_es_user: "{{ vault_mastodon_es_user }}"
mastodon_es_pass: "{{ vault_mastodon_es_pass }}"
mastodon_s3_enabled: 'true'
mastodon_s3_protocol: https
mastodon_s3_bucket: media
mastodon_s3_region: auto
mastodon_s3_hostname: "{{ vault_mastodon_s3_hostname }}"
mastodon_s3_endpoint: "{{ vault_mastodon_s3_endpoint }}"
mastodon_aws_access_key_id: "{{ vault_mastodon_aws_access_key_id }}"
mastodon_aws_secret_access_key: "{{ vault_mastodon_aws_secret_access_key }}"
mastodon_s3_alias_host: media.mementomori.social
mastodon_s3_disable_checksum_mode: 'true'
mastodon_deepl_api_key: "{{ vault_mastodon_deepl_api_key }}"
mastodon_deepl_plan: pro
mastodon_version_metadata: mementomods-2026-09-15
mastodon_github_repository: 'mastodon/mastodon/compare/main...mementomori-social/mastodon:{{ mastodon_version_metadata }}'
mastodon_fetch_replies_enabled: 'true'
mastodon_fetch_replies_cooldown_minutes: 15
mastodon_fetch_replies_initial_wait_minutes: 5
mastodon_fetch_replies_max_global: 1000
mastodon_fetch_replies_max_single: 500
mastodon_fetch_replies_max_pages: 500
# classic, not discoverable: StatusesIndex discards any status whose
# searchable_by is empty, so wider scopes scan millions of rows to keep
# the same documents. Measured 14.9.2026: 22 months versus minutes.
mastodon_status_search_scope: classic
mastodon_account_search_scope: discoverable
mastodon_active_record_encryption_primary_key: "{{ vault_mastodon_active_record_encryption_primary_key }}"
mastodon_active_record_encryption_deterministic_key: "{{ vault_mastodon_active_record_encryption_deterministic_key }}"
mastodon_active_record_encryption_key_derivation_salt: "{{ vault_mastodon_active_record_encryption_key_derivation_salt }}"
mastodon_experimental_features: inbound_quotes,outgoing_quotes,modern_emojis,wrapstodon
mastodon_captcha_provider: turnstile
mastodon_turnstile_site_key: "{{ vault_mastodon_turnstile_site_key }}"
mastodon_turnstile_secret_key: "{{ vault_mastodon_turnstile_secret_key }}"
mastodon_api_registrations_require_invite: 'true'
# Comma-separated regexes. Vaulted so the public repo does not hand
# spammers the exact signature being blocked.
mastodon_blocked_username_patterns: "{{ vault_mastodon_blocked_username_patterns }}"


mastodon_upgrade_scripts_version: 621bef1
mastodon_finnish_users_version: 78ac545
mastodon_finnish_users_client_id: "{{ vault_finnish_users_client_id }}"
mastodon_finnish_users_client_secret: "{{ vault_finnish_users_client_secret }}"
mastodon_finnish_users_access_token: "{{ vault_finnish_users_access_token }}"
mastodon_finnish_users_revoke_url: https://mementomori.social/oauth/revoke
mastodon_finnish_users_token_url: https://mementomori.social/oauth/token
mastodon_finnish_users_redirect_uri: https://mementomori.social/suomalaiset-mastodon-kayttajat
mastodon_fedifetch_version: d184f8d
