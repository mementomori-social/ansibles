---
- name: Define users
  ansible.builtin.user:
    name: "{{ item }}"
    state: present
    append: true
    shell: /usr/bin/bash
    groups:
      - sudo
  loop:
    - rolle
    - ikke
    - ansible

- name: Set ssh public keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ lookup('file', item.keyfile) }}"
    exclusive: true
  loop:
    - { name: 'rolle', keyfile: 'pubkeys-rolle.pub' }
    - { name: 'ikke', keyfile: 'pubkeys-ikke.pub' }

- name: Set multiple ssh public keys for ansible user
  ansible.posix.authorized_key:
    user: ansible
    state: present
    key: "{{ lookup('file', item) }}"
    exclusive: false
  loop:
    - pubkeys-rolle.pub
    - pubkeys-ikke.pub

# Only for the UpCloud web console: SSH below refuses passwords and root.
- name: Set the root password
  ansible.builtin.user:
    name: root
    password: "{{ vault_root_password_hash }}"
  no_log: true

- name: Fix SSH options
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regex: "^{{ item.option }}"
    insertafter: "^ *# *{{ item.option }}"
    line: "{{ item.line }}"
  loop:
    # deny password or root login
    - { option: 'PermitRootLogin', line: 'PermitRootLogin no' }
    - { option: 'PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { option: 'ListenAddress', line: "ListenAddress {{ mementomori_sshd_listen_address | default('0.0.0.0')}}" }
  notify: Restart sshd

- name: Give passwordless sudo powers to sudo group
  ansible.builtin.copy:
    dest: /etc/sudoers.d/01-sudo-group
    content: |
      # Ansible managed
      %sudo ALL=(ALL) NOPASSWD:ALL

- name: Refresh apt package lists
  tags: pkgs
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install some basic goodies
  tags: pkgs
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - acl
    - tmux
    - zsh
    - btop

- name: Find the private network interface
  ansible.builtin.set_fact:
    private_iface: "{{ item }}"
  loop: "{{ ansible_facts.interfaces }}"
  when:
    - ansible_facts[item].ipv4 is defined
    - ansible_facts[item].ipv4.address is match(private_net_prefix | regex_escape)

- name: Find whether the host has a public interface
  ansible.builtin.set_fact:
    has_public_iface: true
  loop: "{{ ansible_facts.interfaces }}"
  when:
    - ansible_facts[item].ipv4 is defined
    - ansible_facts[item].ipv4.address is not match('10\.')
    - ansible_facts[item].ipv4.address is not match('127\.')

# Both DHCP default routes arrive with metric 100 and the private one wins at
# random, which cuts the host off from the internet.
- name: Prefer the public default route over the private one
  ansible.builtin.copy:
    dest: /etc/netplan/60-private-route-metric.yaml
    mode: "0600"
    content: |
      # Ansible managed
      network:
        version: 2
        ethernets:
          {{ private_iface }}:
            dhcp4-overrides:
              route-metric: {{ private_route_metric }}
  when: has_public_iface | default(false) and private_iface is defined
  notify: Apply netplan
