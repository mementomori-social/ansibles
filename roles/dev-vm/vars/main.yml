---
dev_vm_docker_apt_repo: https://download.docker.com/linux
dev_vm_ca_anchor:
  Archlinux: /etc/ca-certificates/trust-source/anchors/mkcert-rootCA.crt
  Debian: /usr/local/share/ca-certificates/mkcert-rootCA.crt
  RedHat: /etc/pki/ca-trust/source/anchors/mkcert-rootCA.crt
dev_vm_ca_update:
  Archlinux: trust extract-compat
  Debian: update-ca-certificates
  RedHat: update-ca-trust
# Compose program that `podman compose` runs, per distribution
dev_vm_podman_compose_package:
  Ubuntu: docker-compose-v2
  Debian: docker-compose
dev_vm_os_families:
  - Darwin
  - Archlinux
  - Debian
  - RedHat
# Indexed by "is macOS". Prints one command name per process on 443.
dev_vm_listeners_cmd:
  true: lsof -nP -iTCP:443 -sTCP:LISTEN -Fc | sed -n 's/^c//p' | sort -u
  false: ss -ltnpH 'sport = :443' | grep -o '(("[^"]*"' | tr -d '("' | sort -u
