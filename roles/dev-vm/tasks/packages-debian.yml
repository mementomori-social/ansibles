---
# Docker from Docker's own apt repository, as dev/README.md in the fork says.
# The distro packages can ship a Compose older than dev_vm_compose_min_version.
- name: Install apt prerequisites, mkcert and nss
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - mkcert
      - libnss3-tools
    state: present
    update_cache: true

- name: Add Docker's apt key
  become: true
  ansible.builtin.get_url:
    url: "{{ dev_vm_docker_apt_repo }}/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker's apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ dev_vm_docker_apt_repo }}/{{ ansible_facts.distribution | lower }} {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Linux Docker setup
  ansible.builtin.include_tasks: docker-linux.yml
