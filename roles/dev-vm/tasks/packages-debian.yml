---
# With Docker: Docker's own apt repository, as dev/README.md in the fork says,
# since the distro packages can ship a Compose older than the minimum.
- name: Install apt prerequisites, mkcert and nss
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - mkcert
      - libnss3-tools
    state: present
    update_cache: true

- name: Install Podman
  become: true
  ansible.builtin.apt:
    name:
      - podman
      - "{{ dev_vm_podman_compose_package[ansible_facts.distribution] | default('docker-compose') }}"
    state: present
  when: dev_vm_engine == 'podman'

- name: Docker from Docker's apt repository
  when: dev_vm_engine == 'docker'
  block:
    - name: Add Docker's apt key
      become: true
      ansible.builtin.get_url:
        url: "{{ dev_vm_docker_apt_repo }}/{{ ansible_facts.distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker's apt repository
      become: true
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc]
          {{ dev_vm_docker_apt_repo }}/{{ ansible_facts.distribution | lower }} {{ ansible_facts.distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Linux engine setup
  ansible.builtin.include_tasks: "{{ dev_vm_engine }}-linux.yml"
