---
- name: Find Homebrew
  ansible.builtin.command: brew --prefix
  register: dev_vm_brew
  changed_when: false

- name: Install mkcert and nss
  community.general.homebrew:
    name:
      - mkcert
      - nss
    path: "{{ dev_vm_brew.stdout }}/bin"
    state: present

- name: Check Docker Compose
  ansible.builtin.include_tasks: compose-version.yml

# force replaces a Docker.app that was not installed with Homebrew.
- name: Install Docker Desktop
  community.general.homebrew_cask:
    name: docker-desktop
    path: "{{ dev_vm_brew.stdout }}/bin"
    install_options: force
    state: present
  when: not dev_vm_compose_ok

- name: Start Docker
  ansible.builtin.command: open -a Docker
  changed_when: false

- name: Wait for Docker (accept the licence on Docker Desktop's first start)
  ansible.builtin.command: docker info
  register: dev_vm_docker_info
  until: dev_vm_docker_info.rc == 0
  retries: "{{ dev_vm_docker_ready_retries }}"
  delay: 5
  changed_when: false

- name: Recheck Docker Compose
  ansible.builtin.include_tasks: compose-version.yml

- name: Fail on an old Docker Compose
  ansible.builtin.assert:
    that: dev_vm_compose_ok
    fail_msg: "Docker Compose {{ dev_vm_compose_min_version }} or newer is needed, found '{{ dev_vm_compose_version }}'. Update Docker Desktop or OrbStack."

- name: Run docker as this user
  ansible.builtin.set_fact:
    dev_vm_shell: eval "$DEV_VM_CMD"
