---
- name: Install Docker, mkcert and nss
  become: true
  community.general.pacman:
    name:
      - docker
      - docker-buildx
      - docker-compose
      - mkcert
      - nss
    state: present

- name: Linux Docker setup
  ansible.builtin.include_tasks: docker-linux.yml
