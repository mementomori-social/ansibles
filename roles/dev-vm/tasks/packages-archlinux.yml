---
- name: Install mkcert and nss
  become: true
  community.general.pacman:
    name:
      - mkcert
      - nss
    state: present

- name: Install Podman
  become: true
  community.general.pacman:
    name:
      - podman
      - docker-compose
    state: present
  when: dev_vm_engine == 'podman'

- name: Install Docker
  become: true
  community.general.pacman:
    name:
      - docker
      - docker-buildx
      - docker-compose
    state: present
  when: dev_vm_engine == 'docker'

- name: Linux engine setup
  ansible.builtin.include_tasks: "{{ dev_vm_engine }}-linux.yml"
