---
# Podman on macOS runs containers in a Linux VM, the Podman machine.
- name: Install Podman and Docker Compose
  community.general.homebrew:
    name:
      - podman
      - docker-compose
    path: "{{ dev_vm_brew.stdout }}/bin"
    state: present

- name: Read the Podman machine
  ansible.builtin.command: podman machine inspect --format '{{ '{{' }}.State{{ '}}' }}'
  register: dev_vm_machine
  changed_when: false
  failed_when: false

# Rootful, so containers can use port 443 and the checkout is shared as is
- name: Create the Podman machine
  ansible.builtin.command: >-
    podman machine init --rootful --cpus {{ dev_vm_podman_cpus }}
    --memory {{ dev_vm_podman_memory_mb }} --disk-size {{ dev_vm_podman_disk_gb }}
  changed_when: true
  when: dev_vm_machine.rc != 0

- name: Start the Podman machine
  ansible.builtin.command: podman machine start
  changed_when: true
  when: dev_vm_machine.stdout != 'running'

- name: Find the Podman machine's socket
  ansible.builtin.command: podman machine inspect --format '{{ '{{' }}.ConnectionInfo.PodmanSocket.Path{{ '}}' }}'
  register: dev_vm_podman_socket
  changed_when: false

# Talk to the machine over its local socket instead of SSH, which can fail on
# an unrelated broken line in ~/.ssh/known_hosts.
- name: Read Podman connections
  ansible.builtin.command: podman system connection list --format '{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.URI{{ '}}' }} {{ '{{' }}.Default{{ '}}' }}'
  register: dev_vm_podman_connections
  changed_when: false

- name: Use the machine's socket
  ansible.builtin.command: podman system connection add --default mementomori-dev-socket unix://{{ dev_vm_podman_socket.stdout }}
  changed_when: true
  when: ('unix://' ~ dev_vm_podman_socket.stdout ~ ' true') not in dev_vm_podman_connections.stdout

- name: Wait for Podman
  ansible.builtin.command: podman info
  register: dev_vm_podman_info
  until: dev_vm_podman_info.rc == 0
  retries: "{{ dev_vm_docker_ready_retries }}"
  delay: 5
  changed_when: false

- name: Check Docker Compose
  ansible.builtin.include_tasks: compose-version.yml

- name: Fail on an old Docker Compose
  ansible.builtin.assert:
    that: dev_vm_compose_ok
    fail_msg: "Docker Compose {{ dev_vm_compose_min_version }} or newer is needed for podman compose, found '{{ dev_vm_compose_version }}'. Run: brew upgrade docker-compose"
