---
- name: Check for an existing checkout
  ansible.builtin.stat:
    path: "{{ dev_vm_checkout }}/.git"
  register: dev_vm_git

- name: Find the newest mementomods branch
  ansible.builtin.shell: >-
    git ls-remote --heads {{ dev_vm_repo | quote }}
    | grep -oE 'refs/heads/mementomods-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sed 's#refs/heads/##' | sort | tail -1
  register: dev_vm_newest
  changed_when: false
  when:
    - not dev_vm_git.stat.exists
    - dev_vm_branch | length == 0

- name: Clone the fork
  ansible.builtin.git:
    repo: "{{ dev_vm_repo }}"
    dest: "{{ dev_vm_checkout }}"
    version: "{{ dev_vm_branch or dev_vm_newest.stdout }}"
  when: not dev_vm_git.stat.exists

- name: Check the checkout has the dev stack
  ansible.builtin.stat:
    path: "{{ dev_vm_checkout }}/bin/mementomori-dev"
  register: dev_vm_script

- name: Fail on a checkout without the dev stack
  ansible.builtin.assert:
    that: dev_vm_script.stat.exists
    fail_msg: "{{ dev_vm_checkout }} has no bin/mementomori-dev. Switch it to the newest mementomods-YYYY-MM-DD branch."
