# Permissive zone used to opt static asset locations out of the `flood`
# request-rate limit that bots.d/ddos.conf applies to the whole server.
#
# nginx has no `limit_req off`. limit_req is inherited from the enclosing level
# only if the current level declares none, so declaring this zone inside a
# location replaces the inherited flood limit for that location.
#
# Defined here rather than in botblocker-nginx-settings.conf because that file
# belongs to the nginx-ultimate-bad-bot-blocker package and is overwritten by
# update-ngxblocker, which runs nightly from cron.
limit_req_zone $binary_remote_addr zone=staticassets:10m rate=1000r/s;
