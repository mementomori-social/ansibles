# Diagnostic log: cache status and timing for requests that did NOT hit cache.
#
# Added 2026-08-15 after a distributed crawler sent bogus `Authorization: Basic`
# headers. Several public API endpoints answer with `Vary: Authorization`, so
# nginx stored a separate cache entry per header value, the cache stopped
# working and every request reached puma. Diagnosis was slow because the main
# access log records neither $upstream_cache_status nor $request_time.
#
# Deliberately NOT written into the main access.log:
#   1. Vector ships /var/log/nginx/*.log to Better Stack and parses it with a
#      regex whose trailing group is greedy and unanchored. Extra fields at the
#      end would be swallowed into the user-agent capture, silently corrupting
#      it, and because the regex would still match, Vector's ?? fallback chain
#      would never fire.
#   2. The .jsonl extension keeps this file outside Vector's *.log glob, so it
#      is not shipped and does not inflate the Better Stack bill.
#
# Only non-HIT responses are logged, which keeps the volume low while still
# catching the failure this exists to detect: a cache that stops hitting.

log_format diag escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","status":$status,'
  '"cache":"$upstream_cache_status","rt":$request_time,'
  '"urt":"$upstream_response_time","method":"$request_method",'
  '"uri":"$uri","args":"$args","ua":"$http_user_agent"}';

# "" = request never went upstream (static file), HIT = served from cache.
# Everything else (MISS, BYPASS, EXPIRED, STALE, UPDATING, REVALIDATED) is logged.
map $upstream_cache_status $log_diag {
  ""      0;
  "HIT"   0;
  default 1;
}

access_log /var/log/nginx/diag.jsonl diag if=$log_diag;
