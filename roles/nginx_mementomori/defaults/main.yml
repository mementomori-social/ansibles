---
# Set to false if nginx is installed outside this role.
nginx_mementomori_install_nginx: true

# Set to true when testing in containers without systemd.
nginx_mementomori_skip_systemd: false
nginx_disable_all: false

nginx_mementomori_mastodon_home: /data/mastodon

#
# nginx-ultimate-bad-bot-blocker (tasks/install-bot-blocker.yml)
# https://github.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker
#
# Set to false to skip downloading the blocker. Vhosts wire the blocker in
# from inside their server blocks (see roles/nginx), so a fresh site does not
# need this role to insert anything. Rolle said this shoulde be disabled as
# it casued problems earlier. Here anyway, if needed, as the old one had it.
nginx_mementomori_bot_blocker_enabled: false
nginx_mementomori_bot_blocker_url: https://raw.githubusercontent.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker/master
nginx_mementomori_bot_blocker_scripts:
  - install-ngxblocker
  - setup-ngxblocker
  - update-ngxblocker
nginx_mementomori_bot_blocker_confd_files:
  - globalblacklist.conf
  - botblocker-nginx-settings.conf
nginx_mementomori_bot_blocker_bot_files:
  - blockbots.conf
  - ddos.conf
  - custom-bad-referrers.conf
  - bad-referrer-words.conf
  - blacklist-ips.conf
  - blacklist-user-agents.conf
  - whitelist-domains.conf
  - whitelist-ips.conf

# nginx.conf directives tuned with lineinfile, mirroring the hand-tuned live
# server. Each entry writes "<key> <value>;" into the http block. Entries with
# `regexp` replace an existing line; entries with `insertafter` place a line
# that is absent from the stock config.
nginx_mementomori_tunables:
  - key: worker_processes
    value: "8"
    regexp: '^worker_processes auto;$'
  - key: worker_rlimit_nofile
    value: 8192
    insertafter: '^\s*worker_processes [0-9]+;$'
  - key: worker_connections
    value: 8192
    regexp: '^\s*worker_connections [0-9]+;$'
  - key: multi_accept
    value: "on"
    regexp: '^\s*#\s*multi_accept\s+on;\s*$'
  - key: server_tokens
    value: "off"
    regexp: '^(\s*)#?\s*server_tokens\s+.*$'
  - key: open_file_cache
    value: "max=10000 inactive=60s"
    insertafter: '^\s*default_type\s+application/octet-stream;\s*$'
  - key: open_file_cache_valid
    value: 120s
    insertafter: '^\s*open_file_cache\s+.*;$'
  - key: open_file_cache_min_uses
    value: 2
    insertafter: '^\s*open_file_cache_valid\s+[0-9]+s;$'
  - key: open_file_cache_errors
    value: "on"
    insertafter: '^\s*open_file_cache_min_uses\s+[0-9]+;$'
  # Larger proxy buffers were needed because a 4096-byte proxy_buffer_size was
  # not enough for Mastodon API cache keys ("upstream sent too big header").
  - key: proxy_buffers
    value: "4 128k"
    insertafter: '^\s*open_file_cache_errors\s+\w+;$'
  - key: proxy_buffer_size
    value: 128k
    insertafter: '^\s*proxy_buffers\s+[0-9]+\s+[0-9A-Za-z]+;$'
  - key: proxy_busy_buffers_size
    value: 128k
    insertafter: '^\s*proxy_buffer_size\s+[0-9A-Za-z]+;$'
  - key: ssl_protocols
    value: "TLSv1.2 TLSv1.3"
    regexp: '^\s*ssl_protocols\s+.*$'

# Brotli comes from the distro packages (libnginx-mod-http-brotli-filter and
# libnginx-mod-http-brotli-static, Ubuntu 24.04+ and Debian), which load the
# modules via /etc/nginx/modules-enabled/. nginx_mementomori_brotli_types feeds
# the blockinfile block in nginx.conf.
nginx_mementomori_brotli_types:
  - text/plain
  - text/css
  - text/xml
  - text/javascript
  - text/x-component
  - application/xml
  - application/xml+rss
  - application/javascript
  - application/json
  - application/atom+xml
  - application/vnd.ms-fontobject
  - application/x-font-ttf
  - application/x-font-opentype
  - application/x-font-truetype
  - application/x-web-app-manifest+json
  - application/xhtml+xml
  - application/octet-stream
  - font/opentype
  - font/truetype
  - font/eot
  - font/otf
  - image/svg+xml
  - image/x-icon
  - image/vnd.microsoft.icon
  - image/bmp

# These replace the crontab from old mastodon server
nginx_mementomori_timers:
  - name: certbot-renew
    # ok
    description: Auto renew Let's Encrypt certificates
    schedule: "*-*-* 00,12:00:00"
    command: /usr/local/bin/certbot-renew.sh
    output: discard
  - name: backup
    # script is missing, we will drop this
    description: Full backup
    schedule: "Sun *-*-* 04:00:00"
    command: /usr/bin/bash /usr/local/bin/backup.sh
    output: discard
    enabled: false
  - name: prune-rclone-logs
    # script is missing, we will drop this
    description: Prune rclone logs every night
    schedule: "*-*-* 04:05:00"
    command: /bin/sh -c 'rm /var/log/rclone/*.log*'
    output: discard
    enabled: false
  - name: backup-to-storagebox
    # script is missing, we will drop this
    description: Backup to Storagebox
    schedule: "*-*-* 03:00:00"
    command: /usr/bin/bash /root/backup-to-storagebox/backup-to-storagebox.sh / /backups/mementomori.social
    output: journal
    enabled: false
  - name: mount-all
    # we will drop this
    description: Mount all fstab entries after boot
    boot_delay: 60
    command: /bin/mount -a
    output: discard
    remain_after_exit: true
    enabled: false
  - name: update-ngxblocker
    # we will drop this
    description: Update nginx-ultimate-bad-bot-blocker blacklist
    schedule: "*-*-* 03:00:00"
    command: /usr/local/sbin/update-ngxblocker -n
    output: journal
    enabled: false

# Set to false in tests/containers so live production certificates are
# not interfeared.
nginx_mementomori_letsencrypt_enabled: true
nginx_mementomori_letsencrypt_email: "{{ vault_letsencrypt_email | default('') }}"
nginx_mementomori_cloudflare_api_token: "{{ vault_letsencrypt_cloudflare_api_token | default('') }}"

nginx_mementomori_dns_records:
  - record: '@'
    type: A
    value: "{{ ansible_facts.eth0.ipv4.address }}"
  - record: '@'
    type: AAAA
    value: "{{ (ansible_facts.eth1.ipv6 | selectattr('scope', 'equalto', 'global') | first).address }}"
  - record: 'www'
    type: A
    value: "{{ ansible_facts.eth0.ipv4.address }}"
  - record: 'www'
    type: AAAA
    value: "{{ (ansible_facts.eth1.ipv6 | selectattr('scope', 'equalto', 'global') | first).address }}"
  - record: 'rolle'
    type: A
    value: "{{ ansible_facts.eth0.ipv4.address }}"
  - record: 'rolle'
    type: AAAA
    value: "{{ (ansible_facts.eth1.ipv6 | selectattr('scope', 'equalto', 'global') | first).address }}"

# Certificates to obtain. name is the certbot --cert-name (and the
# /etc/letsencrypt/live/<name>/ symlink the vhosts reference); domains are the
# names in the certificate.
nginx_mementomori_letsencrypt_certs:
  - name: mementomori.social
    domains:
      - mementomori.social
      - www.mementomori.social
  - name: rolle.mementomori.social
    domains:
      - rolle.mementomori.social

# Seconds certbot waits for the Cloudflare DNS TXT record to propagate.
nginx_mementomori_letsencrypt_propagation_seconds: 30
