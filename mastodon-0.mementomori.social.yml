---
- name: Configure mastodon host
  hosts: mastodon-0.mementomori.social
  become: true
  roles:
    - role: common
      vars:
        mementomori_sshd_listen_address: "{{ mastodon_0_int_ip }}"
    - netdata
    - valkey
    - role: nginx_mementomori
      vars:
        nginx_disable_all: true
    - role: mastodon
      vars:
        mastodon_disable_all: true
        mastodon_db_host: 10.222.223.20
        mastodon_replica_db_host: 10.222.222.13
